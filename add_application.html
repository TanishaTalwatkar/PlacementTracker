<!DOCTYPE html>
<html>

<head>

    <title>Add Application</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Add Internship / Job Application</h1>

    <form method="POST">

        <label>Company Name</label>

        <input
            type="text"
            name="company"
            required
        >


        <label>Position</label>

        <input
            type="text"
            name="position"
            required
        >


        <label>Application Date</label>

        <input
            type="date"
            name="date"
            required
        >


        <label>Package</label>

        <input
            type="text"
            name="package"
            placeholder="Example: 6 LPA"
        >


        <label>Location</label>

        <input
            type="text"
            name="location"
            placeholder="Example: Mumbai"
        >


        <button type="submit">

            Submit Application

        </button>

    </form>


    <br>


    <a href="/dashboard">

        🏠 Back to Dashboard

    </a>

</div>

</body>

</html>
