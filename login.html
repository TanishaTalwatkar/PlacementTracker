<!DOCTYPE html>
<html>

<head>

    <title>Student Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Student Login</h1>


    <form method="POST">

        <label>Email</label>

        <input type="email"
               name="email"
               required>


        <label>Password</label>

        <input type="password"
               name="password"
               required>


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        New student?
        <a href="/register">
            Create Account
        </a>
    </p>

</div>

</body>

</html>
