<!DOCTYPE html>
<html>

<head>

    <title>Student Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Student Registration</h1>

    <form method="POST">

        <label>Name</label>

        <br>

        <input type="text"
               name="name"
               required>

        <br><br>


        <label>Email</label>

        <br>

        <input type="email"
               name="email"
               required>

        <br><br>


        <label>Password</label>

        <br>

        <input type="password"
               name="password"
               required>

        <br><br>


        <label>Course</label>

        <br>

        <input type="text"
               name="course"
               value="MCA"
               required>

        <br><br>


        <button type="submit">
            Register
        </button>

    </form>

    <br>

    <a href="/login">Already have an account? Login</a>

</body>

</html>
